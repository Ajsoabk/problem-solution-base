<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题解集</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f1720'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%235eead4' font-family='serif'>題</text></svg>">
</head>
<body data-page="list">

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="index.html">題解</a>
    <span class="crumb">题解集</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnTheme" title="切换深色 / 浅色" aria-label="切换主题">◐</button>
  </div>
</header>

<main class="wrap">

  <div class="hero">
    <h1>题解集</h1>
  </div>

  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="搜题号、题目、知识点" autocomplete="off" aria-label="搜索题目">
    <span class="count" id="count"></span>
  </div>

  <ul class="plist" id="plist"></ul>
  <p class="empty" id="empty" hidden>没有匹配的题目。</p>

</main>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script src="assets/list.js"></script>
</body>
</html>
